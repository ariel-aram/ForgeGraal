# Cross-compiling to 32-bit Windows uses the mingw-w64 toolchain. Kept in the repo so that
# `cargo build --target i686-pc-windows-gnu` works without per-machine setup.
[target.i686-pc-windows-gnu]
linker = "i686-w64-mingw32-gcc"
ar = "i686-w64-mingw32-ar"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

# rquickjs-sys generates its FFI bindings with bindgen, and libclang here has no resource
# headers of its own, so it needs to be pointed at a toolchain that has stdbool.h. Set per
# target because the Windows build must see mingw's headers, not the host's.
[env]
BINDGEN_EXTRA_CLANG_ARGS_x86_64_unknown_linux_gnu = "-I/usr/lib/gcc/x86_64-linux-gnu/13/include"
BINDGEN_EXTRA_CLANG_ARGS_i686_pc_windows_gnu = "--target=i686-w64-mingw32 -I/usr/lib/gcc/i686-w64-mingw32/13-win32/include -I/usr/i686-w64-mingw32/include"
CC_i686_pc_windows_gnu = "i686-w64-mingw32-gcc"
AR_i686_pc_windows_gnu = "i686-w64-mingw32-ar"
