[package]
name = "forgegraal-runtime"
version = "0.1.0"
edition = "2021"
description = "Native runtime host for ForgeScript bots on quickjs-ng: sockets, TLS, crypto and compression"
license = "GPL-3.0-or-later"

[[bin]]
name = "forgegraal-runtime"
path = "src/main.rs"

[dependencies]
# `bindgen` generates the FFI bindings at build time; the crate only ships
# pre-generated ones for a handful of hosts, and 32-bit Windows is not among them.
rquickjs = { version = "0.9", features = ["full-async", "parallel", "bindgen"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
# default features off: they enable rustls's aws-lc-rs provider, which drags in a
# C build (aws-lc-sys) that does not cross-compile cleanly to 32-bit Windows.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
flate2 = "1"
rand = "0.8"
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 2
lto = true
strip = true
panic = "abort"
